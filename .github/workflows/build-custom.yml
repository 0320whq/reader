name: Build Custom Reader Image

on:
  push:
    tags:
      - 'custom-**'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: '14'
      -
        name: Build web
        run: cd web && npm install && npm run build
      -
        name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: 'gradle'
      -
        name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 6.1.1
      -
        name: Build Java
        run: |
          mv ./web/dist ./src/main/resources/web
          rm src/main/java/com/htmake/reader/ReaderUIApplication.kt
          gradle -b cli.gradle assemble --info
          mv ./build/libs/*.jar ./reader.jar
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/0320whq/reader
          tags: |
            type=ref,event=tag
            type=raw,value=custom-latest
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: |
            linux/amd64
      -
        name: Export Docker image to tar.gz
        run: |
          docker pull ghcr.io/0320whq/reader:custom-latest
          docker save ghcr.io/0320whq/reader:custom-latest | gzip > reader-custom.tar.gz
      -
        name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: reader-custom-image
          path: reader-custom.tar.gz
          retention-days: 7

